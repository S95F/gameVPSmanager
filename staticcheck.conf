# staticcheck configuration for gvm.
#
# U1000 (unused code) is disabled. The tree is built bottom-up, so library
# slices routinely land a phase or two before the wiring that calls them (the
# "built but not wired" pattern USABILITY-PLAN describes). U1000 would flag all
# of that intentionally-ahead code. Re-enable once J1 closes the gap and any
# remaining unused symbol is genuinely dead.
#
# The ST* stylecheck group is disabled. gvm keeps its own house conventions for
# doc comments and error strings (proper-noun prefixes like Forge/Maven/Caddy,
# multi-line operator-facing messages, comments that do not restate the
# identifier), and renaming exported fields to satisfy ST1003 would be an API
# change. The bug-finding SA* checks and the S* simplifications stay on.
checks = ["all", "-U1000", "-ST1*"]
