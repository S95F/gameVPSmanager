name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Development happens on Windows and deployment is Linux-only, so both
    # have to stay green. A Linux-only file that is not behind a build tag
    # breaks the developer's own machine, and a Windows-only assumption
    # breaks the only host that matters in production.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l . | grep -v '^legacy/' || true)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1 -race

      - name: cross-compile the deploy target
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/...
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/...

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck the vendored bash suite
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # The legacy tree is reference material, not shipped code: report
          # findings without failing the build.
          shellcheck -S warning legacy/projectzomboid-bash/*.sh \
            legacy/projectzomboid-bash/lib/*.sh || true

  gates:
    # Phase 17 hardening gates. Run on Linux only (bash + file paths).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: control-plane-dead
        run: bash ci/control-plane-dead.sh

      - name: golden-units
        run: bash ci/golden-units.sh

      - name: no-shell-in-gvm
        # gvm must never spawn a shell. Grep for exec.Command calls that could
        # launch sh/bash/python directly.
        run: |
          if grep -r 'exec\.Command.*"\(sh\|bash\|python\|/bin/sh\)"' internal/ cmd/ 2>/dev/null | grep -v '_test\.go'; then
            echo "FAIL: shell invocation found in non-test code"
            exit 1
          fi
          echo "OK: no shell invocations found"

      - name: no-kill-9-in-gvm
        # gvm must never SIGKILL a game server (corrupts worlds).
        run: |
          if grep -r 'syscall\.SIGKILL\|kill.*-9\|Signal(9)' internal/ cmd/ 2>/dev/null | grep -v '_test\.go' | grep -v 'adopt\|rollback'; then
            echo "FAIL: SIGKILL found in non-test, non-rollback code"
            exit 1
          fi
          echo "OK: no SIGKILL in game-facing code"

      - name: no-unauthenticated-api
        # /api/v1 routes must require auth. Verify no handler is registered
        # without going through the auth middleware.
        run: |
          if grep -r 'http\.HandleFunc.*api/v1\|mux\.HandleFunc.*api/v1' internal/web/ 2>/dev/null; then
            echo "FAIL: bare /api/v1 route found (must go through auth middleware)"
            exit 1
          fi
          echo "OK: no bare /api/v1 routes"

      - name: dashboard-linked-whole
        # Phase 48 linked the web tier; what must now hold is that it came in
        # WHOLE: `gvm web`, `gvm gvmd` and the muxes ship together, so a build
        # cannot carry the dashboard's routes without its auth.
        run: |
          deps="$(go list -deps ./cmd/gvm)"
          for pkg in internal/web internal/auth internal/authz internal/webapi internal/gvmd internal/webstore; do
            if ! echo "$deps" | grep -q "gameVPSmanager/${pkg}\$"; then
              echo "FAIL: cmd/gvm no longer links ${pkg}; the dashboard must ship whole"
              exit 1
            fi
          done
          echo "OK: cmd/gvm links the whole web tier"

  caddy-validate:
    # Phase 47 item 6: the real Caddy must accept every golden Caddyfile.
    # The stock goldens are validated at spec.edge.caddy.min_version. The
    # acme-dns golden needs the cloudflare DNS module, which add-package
    # fetches from Caddy's build service — that binary tracks Caddy's current
    # release, the same thing an operator's `caddy add-package` gets.
    runs-on: ubuntu-latest
    env:
      CADDY_VERSION: "2.11.1"
    steps:
      - uses: actions/checkout@v4

      - name: download pinned caddy
        run: |
          curl -fsSL -o caddy.tar.gz \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          tar -xzf caddy.tar.gz caddy
          ./caddy version

      - name: validate stock goldens at the minimum supported version
        run: |
          # validate provisions the site's log writer, which mkdirs the
          # configured directory — give it one it may write.
          sudo install -d -m 0777 /var/log/caddy
          for f in internal/caddyconf/testdata/acme-http.golden \
                   internal/caddyconf/testdata/internal-bareip.golden \
                   internal/caddyconf/testdata/snippet-import.golden; do
            echo "== $f"
            ./caddy validate --config "$f" --adapter caddyfile
          done

      - name: validate the acme-dns golden with the cloudflare module
        # The token is a well-formed placeholder: the provider checks its
        # shape at provision time, and validate never contacts Cloudflare.
        run: |
          ./caddy add-package github.com/caddy-dns/cloudflare
          ./caddy version
          CF_API_TOKEN="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA" \
            ./caddy validate --config internal/caddyconf/testdata/acme-dns.golden --adapter caddyfile

  journey:
    # The end-to-end lifecycle test on a real systemd host (ci/journey.sh):
    # host init, then create/apply/start a provider:none fixture game, assert it
    # reaches ready, prove the live unit needs no control plane (and survives
    # Postgres going down), back up and verify, then stop cleanly. ubuntu-latest
    # has systemd and passwordless sudo. This is the only job that exercises a
    # real gvm@.service; everything else tests against fake HostEnvs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache: true

      - name: journey
        run: bash ci/journey.sh
