# /usr/lib/tmpfiles.d/gvm.conf  -- ARCHITECTURE.md 5.1
#
# These directories are the package's, not any unit's. /run/gvm in particular
# is deliberately NOT a RuntimeDirectory= on gvmd: `systemctl stop gvmd` must
# not delete every instance's console socket (D-05).
#
# Every mode here is load-bearing:
#   /etc/gvm            0750 root:gvm    so the unprivileged web tier can READ
#                                        a spec for rendering and can never
#                                        write one.
#   /etc/gvm/secrets    0700 root:root   untraversable to that same tier, which
#                                        is what makes 0750 above safe (D-02).
#   /var/backups/gvm    0700 root:root   a compromised mod must not be able to
#                                        read every world the server has ever
#                                        had (D-44). This is the one line of
#                                        install.sh deliberately not ported.
#   /var/log/gvm        0755 root:root   0755, not 0750: `gvm apply` creates
#                                        /var/log/gvm/<name> at 0750 with ONE
#                                        mkdir and refuses a missing parent, so
#                                        this line is what makes that work.
#   /var/lib/gvm        0751 root:root   0751 and not 0750: the chain down to
#   .../cache                            /var/lib/gvm/cache/steam/homes/<name>
#   .../cache/steam                      has to be TRAVERSABLE by gvm-<name>,
#   .../cache/steam/homes                which owns that leaf (D-30) and runs
#                                        both steamcmd and D-15's write-probe.
#                                        ARCHITECTURE:110 has doctor assert
#                                        gvm-<name> is in no group but its own,
#                                        so no group can grant it and the
#                                        other-execute bit is the only thing
#                                        left. The missing `r` is what keeps
#                                        the directories unlistable, so nothing
#                                        can enumerate the instances on the box
#                                        from here.
#   /var/lib/gvm/instances 0750 root:root  Deliberately NOT 0751: section 5.3
#                                        says a compromised mod must not be
#                                        able to rewrite content.lock.json or
#                                        lease.json, and nothing but gvmd and
#                                        jobs reads this tree. The SteamCMD
#                                        runscript therefore reaches the unit
#                                        as a LoadCredential= rather than as a
#                                        path the unit opens (jobs/steam.go).
d /run/gvm                  0755 root root -
d /run/gvm/web              2750 gvm  caddy -
d /var/log/gvm              0755 root root -
d /var/lib/gvm              0751 root root -
d /var/lib/gvm/instances    0750 root root -
d /var/lib/gvm/cache        0751 root root -
d /var/lib/gvm/cache/steam  0751 root root -
d /var/lib/gvm/cache/steam/homes 0751 root root -
d /var/lib/gvm/blobs        0755 gvm-fetch gvm-content -
d /var/lib/gvm/blobs/tmp    0750 gvm-fetch gvm-content -
d /var/lib/gvm/downloads    0755 root root -
d /var/lib/gvm/locks        0750 root root -
d /var/lib/gvm/spool        0700 root root -
d /var/backups/gvm          0700 root root -
d /srv/gvm                  0755 root root -
d /etc/gvm                  0750 root gvm  -
d /etc/gvm/instances        0750 root gvm  -
d /etc/gvm/games            0750 root gvm  -
d /etc/gvm/jobs             0750 root gvm  -
d /etc/gvm/caddy            0750 root caddy -
d /etc/gvm/secrets          0700 root root -
d /etc/gvm/secrets/instances 0700 root root -
d /etc/gvm/secrets/host     0700 root root -
