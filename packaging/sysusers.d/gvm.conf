# /usr/lib/sysusers.d/gvm.conf  -- the system accounts gvm's control plane runs
# as. `systemd-sysusers` creates them idempotently; `gvm host init` runs it.
#
# Each is a locked system account with no login shell and no home: none of them
# is ever a person, and a shell on any of them would be one more way a
# compromised mod reached the rest of the box. IDs are left to sysusers (`-`)
# because nothing in gvm hard-codes a uid -- ownership is by name, resolved on
# the host, and a fixed uid would only collide with whatever the distro already
# put there.
#
# The per-instance accounts (gvm-<name>) are NOT here: `gvm apply` creates each
# one as the instance is defined, in its own group and no other (ARCHITECTURE
# 110), so the set of accounts on a box matches the set of servers on it.
#
#Type Name         ID  GECOS                       Home          Shell
u     gvm          -   "gvm control plane"         /nonexistent  /usr/sbin/nologin
u     gvm-fetch    -   "gvm blob fetcher"          /nonexistent  /usr/sbin/nologin
u     gvm-content  -   "gvm content manager"       /nonexistent  /usr/sbin/nologin
u     gvm-console  -   "gvm console access"        /nonexistent  /usr/sbin/nologin
