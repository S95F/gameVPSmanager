apiVersion: gvm/v1
kind: Game
metadata:
  id: satisfactory
  name: Satisfactory Dedicated Server
  revision: 1
  tags: [steam, factory, windows-depot]
  doc: |
    Satisfactory has no native Linux dedicated server binary. The Windows
    dedicated server (appid 1690800) runs under Proton on Linux hosts. SteamCMD
    must fetch the Windows depot (platform: windows).

    There is no RCON of any kind. The admin channel is a REST API on the api
    port (section 18.1 stub), which gvm does not yet implement. Shutdown is via
    console signal.

    Saves live under %LOCALAPPDATA%/FactoryGame/Saved/SaveGames/server -- which
    Proton maps to ~/.steam/steam/steamapps/compatdata/<appid>/pfx/... when
    running under Proton. The data path should point at the Proton prefix.

spec:
  driverABI: 1

  provider:
    kind: steamcmd
    steamcmd:
      install_appid: 1690800
      anonymous: true
      branch: public
      platform: windows
      validate_on: [install, repair]
      sentinel: {path: Engine/Binaries/Win64/UnrealEditor-Cmd.exe, executable: false}
      verify: {appmanifest: true, byte_parity: true, single_acf: true}

  runtime:
    exec: "{{ .Install }}/FactoryServer.exe"
    cwd: "{{ .Install }}"
    wrapper:
      kind: proton
      args:
        - "{{ .Var.proton_path }}"
        - run
    args:
      - "-log"
      - "-NoSteamClient"
      - "-unattended"
      - "?listen"
      - "-Port={{ .Port.game }}"
      - "-BeaconPort={{ .Port.beacon }}"
      - "-ServerQueryPort={{ .Port.query }}"
    env:
      HOME: "{{ .Home }}"
    console: {mode: pipe, charset: utf8, echo_input: false}
    process_group: false
    arch: native
    jit: false
    limits: {nofile: 65535, tasks_max: 4096}

  readiness:
    hard_deadline: 1800s
    stall_timeout: 600s
    progress: ["Setting breakpad minidump", "Game loaded"]
    probes:
      - {kind: a2s, port: query, timeout: 1800s, every: 10s}
    fail_markers:
      - {pattern: "(?i)address already in use", fatal: true,
         hint: "another server holds this port; check `gvm doctor` and `ss -lunp`"}

  shutdown:
    budget: 65s
    steps:
      - {via: wait_exit, wait: 30s}
      - {via: signal, signal: SIGTERM, scope: process, wait: 20s}

  port_stride: {base: 7777, count: 3}
  ports:
    - {name: game,   proto: udp, default: 7777, expose: public,
       note: "Game port; clients connect here"}
    - {name: beacon, proto: udp, default: 15000, expose: public,
       note: "Beacon port for server discovery"}
    - {name: query,  proto: udp, default: 15777, expose: public,
       note: "Steam query port"}

  content: []

  backup:
    include:
      - "{{ .Data }}"
    exclude: []
    world_paths:
      - "{{ .Data }}"
    destroy_protected: []
    freeze:
      before: none
      after:  none
      lease_budget: 120s

  vars:
    proton_path:
      type: string
      required: true
      apply: restart
      help: "Absolute path to the Proton binary, e.g. /usr/share/steam/compatibilitytools.d/GE-Proton9-27/proton"

  sizing:
    memory_model: flat
    native_headroom: 4G
    high_margin: 1G
    ram_floor_mb: 8192
    disk_floor_gb: 30

  recommended_jobs:
    backup: {at: "04:00", keep: 7, persistent: true}

  egress:
    - {host: "*.steampowered.com", why: "SteamCMD depot download"}
    - {host: "*.steamcontent.com", why: "Steam CDN"}
