apiVersion: gvm/v1
kind: Game
metadata:
  id: enshrouded
  name: Enshrouded Dedicated Server
  revision: 1
  tags: [steam, survival, rcon, windows-depot]
  doc: |
    Enshrouded has no native Linux dedicated server binary. The Windows build
    (appid 2278520) runs under Proton. SteamCMD must fetch the Windows depot
    (platform: windows).

    There is no RCON. Shutdown is via console signal only.

    The server writes its configuration to enshrouded_server.json in the data
    directory. Key settings (server name, max players, password) can be set via
    command-line arguments which override the JSON.

    Save files are written to the data directory. The world is identified by the
    server name in the JSON, not by a separate world name argument.

spec:
  driverABI: 1

  provider:
    kind: steamcmd
    steamcmd:
      install_appid: 2278520
      anonymous: true
      branch: public
      platform: windows
      validate_on: [install, repair]
      sentinel: {path: enshrouded_server.exe, executable: false}
      verify: {appmanifest: true, byte_parity: true, single_acf: true}

  runtime:
    exec: "{{ .Install }}/enshrouded_server.exe"
    cwd: "{{ .Install }}"
    wrapper:
      kind: proton
      args:
        - "{{ .Var.proton_path }}"
        - run
    args:
      - "-savedir"
      - "{{ .Data }}"
    env:
      HOME: "{{ .Home }}"
    console: {mode: pipe, charset: utf8, echo_input: false}
    process_group: false
    arch: native
    jit: false
    limits: {nofile: 65535, tasks_max: 4096}

  readiness:
    hard_deadline: 600s
    stall_timeout: 300s
    progress: ["Setting breakpad minidump", "Server started"]
    probes:
      - {kind: a2s, port: game, timeout: 600s, every: 5s}
    fail_markers:
      - {pattern: "(?i)address already in use", fatal: true,
         hint: "another server holds this port; check `gvm doctor` and `ss -lunp`"}

  shutdown:
    budget: 65s
    steps:
      - {via: wait_exit, wait: 30s}
      - {via: signal, signal: SIGTERM, scope: process, wait: 20s}

  port_stride: {base: 15636, count: 2}
  ports:
    - {name: game,  proto: udp, default: 15636, expose: public,
       note: "Game and query port"}
    - {name: query, proto: udp, default: 15637, expose: public,
       note: "Steam query port; typically game+1"}

  content: []

  backup:
    include:
      - "{{ .Data }}"
    exclude:
      - "{{ .Data }}/Logs/**"
    world_paths:
      - "{{ .Data }}"
    destroy_protected: []
    freeze:
      before: none
      after:  none
      lease_budget: 60s

  vars:
    proton_path:
      type: string
      required: true
      apply: restart
      help: "Absolute path to the Proton binary"

  sizing:
    memory_model: flat
    native_headroom: 4G
    high_margin: 1G
    ram_floor_mb: 4096
    disk_floor_gb: 15

  recommended_jobs:
    backup: {at: "04:00", keep: 7, persistent: true}

  egress:
    - {host: "*.steampowered.com", why: "SteamCMD depot download"}
    - {host: "*.steamcontent.com", why: "Steam CDN"}
